name: CI

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt

    - name: Run Ruff Lint
      run: ruff check --output-format=github .

    - name: Run Pytest
      run: pytest --maxfail=1 --disable-warnings -q tests

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: rag-api
            dockerfile: Dockerfile
          - image: ragops-ingestion
            dockerfile: ingestion/Dockerfile
          - image: ragops-evaluation
            dockerfile: evaluation/Dockerfile
          - image: ragops-embedder
            dockerfile: serving/embedder/Dockerfile
          - image: ragops-reranker
            dockerfile: serving/reranker/Dockerfile
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: docker login
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}

  trigger-pipeline:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ragops-cluster
        location: us-west1-a

    - name: Port-forward to KFP
      run: |
        kubectl port-forward -n kubeflow svc/ml-pipeline 8888:8888 &
        for i in $(seq 1 15); do
          curl -sf http://localhost:8888/apis/v2beta1/healthz && break
          sleep 2
        done

    - name: Install KFP SDK and submit run
      run: |
        pip install -r requirements/kfp.txt
        python pipelines/trigger_run.py --host http://localhost:8888
